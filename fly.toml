# fly.toml app configuration file generated for veritas-8825-systems on 2026-04-17T07:21:50-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'veritas-8825-systems'
primary_region = 'dfw'

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# Durable result storage: history.db lives on this volume. Provisioning
# (`fly volumes create veritas_data --region dfw --size 1`) happens at
# deploy time under the gated deploy node — not in code. Single-volume
# model pins the app to one machine; concurrent multi-region scale-out
# is out of scope for this store.
[mounts]
  source = 'veritas_data'
  destination = '/data'

[processes]
  app = "/app/.venv/bin/gunicorn wsgi:app --bind 0.0.0.0:8080 --workers 1 --timeout 120"
